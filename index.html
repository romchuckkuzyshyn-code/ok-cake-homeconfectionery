<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ok cake homeconfectionery</title>
<meta name="description" content="Оксана Кузишин — кондитер, Львів. Прайс на кенді-бар та бісквітні торти.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf6f1;
    --surface: #ffffff;
    --ink: #3b2a24;
    --muted: #8a7469;
    --line: #eadfd6;
    --accent: #c4876b;
    --accent-ink: #ffffff;
    --chip: #f4e9e1;
    --shadow: 0 6px 24px rgba(92, 58, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1714;
      --surface: #2a211d;
      --ink: #f3e8e1;
      --muted: #b49d91;
      --line: #3d312b;
      --accent: #d99c7f;
      --accent-ink: #1d1714;
      --chip: #382c26;
      --shadow: 0 6px 24px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1714;
    --surface: #2a211d;
    --ink: #f3e8e1;
    --muted: #b49d91;
    --line: #3d312b;
    --accent: #d99c7f;
    --accent-ink: #1d1714;
    --chip: #382c26;
    --shadow: 0 6px 24px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 "Manrope", system-ui, sans-serif;
  }
  img { max-width: 100%; display: block; }

  header {
    text-align: center;
    padding: 48px 16px 24px;
  }
  .logo {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: clamp(34px, 7vw, 56px);
    line-height: 1.05;
    letter-spacing: .01em;
    margin: 0;
  }
  .logo em { color: var(--accent); font-style: italic; font-weight: 500; }
  .sub {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav button {
    font: 600 15px "Manrope", sans-serif;
    color: var(--ink);
    background: var(--chip);
    border: 0;
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; }
  .panel[hidden] { display: none; }
  .note {
    text-align: center;
    color: var(--muted);
    margin: 0 auto 28px;
    max-width: 560px;
    font-size: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .photos {
    position: relative;
    aspect-ratio: 4 / 5;
    background: var(--chip);
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .photos::-webkit-scrollbar { display: none; }
  .photos img {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    scroll-snap-align: start;
    cursor: zoom-in;
  }
  .photos .empty {
    margin: auto;
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    font-style: italic;
    color: var(--muted);
  }
  .dots {
    position: absolute;
    left: 0; right: 0; bottom: 10px;
    display: flex; justify-content: center; gap: 6px;
    pointer-events: none;
  }
  .dots span { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.55); cursor: pointer; pointer-events: auto; box-shadow: 0 0 3px rgba(0,0,0,.35); }
  .dots span.on { background: #fff; }
  .wrap { position: relative; }
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.85); color: #3b2a24;
    font-size: 22px; line-height: 38px; padding: 0; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    transition: opacity .2s;
  }
  .nav-btn.prev { left: 10px; }
  .nav-btn.next { right: 10px; }
  .nav-btn[disabled] { opacity: 0; pointer-events: none; }
  .count {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; pointer-events: none;
  }
  .lightbox .nav-btn { position: fixed; }

  .body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card h3 {
    font-family: "Cormorant Garamond", serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.15;
    margin: 0;
  }
  .price {
    flex: none;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .size { color: var(--muted); font-size: 14px; margin: -4px 0 0; }
  .card ul { margin: 0; padding-left: 18px; color: var(--ink); font-size: 14.5px; }
  .card li { margin: 2px 0; }
  .extra { font-size: 13.5px; color: var(--muted); margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 0 16px 40px; }

  .lightbox {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20, 14, 12, .92);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-height: 92vh; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <h1 class="logo">ok cake <em>homeconfectionery</em></h1>
  <p class="sub">Оксана Кузишин · Кондитер · Львів</p>
</header>

<nav role="tablist">
  <button role="tab" id="tab-candy" aria-controls="candy" aria-selected="true">Кенді бар</button>
  <button role="tab" id="tab-cakes" aria-controls="cakes" aria-selected="false">Торти</button>
</nav>

<main>
  <section class="panel" id="candy" role="tabpanel" aria-labelledby="tab-candy">
    <div class="grid" id="candy-grid"></div>
  </section>
  <section class="panel" id="cakes" role="tabpanel" aria-labelledby="tab-cakes" hidden>
    <p class="note">Бісквітні торти. Ціна вказана за 1 кг торта вагою від 2 кг, без декору.</p>
    <div class="grid" id="cakes-grid"></div>
  </section>
</main>

<footer>ok cake homeconfectionery · Львів</footer>

<div class="lightbox" id="lightbox" hidden>
  <img alt="">
  <button class="nav-btn prev" aria-label="Попереднє фото">‹</button>
  <button class="nav-btn next" aria-label="Наступне фото">›</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function card(d) {
    const photos = d.photos.length
      ? d.photos.map(p => `<img src="${p}" alt="${esc(d.name)}" loading="lazy">`).join('')
      : '<span class="empty">фото незабаром</span>';
    const many = d.photos.length > 1;
    const nav = many
      ? `<div class="dots">${d.photos.map((_, i) => `<span data-i="${i}"${i ? '' : ' class="on"'}></span>`).join('')}</div>
         <span class="count">1 / ${d.photos.length}</span>
         <button class="nav-btn prev" aria-label="Попереднє фото" disabled>‹</button>
         <button class="nav-btn next" aria-label="Наступне фото">›</button>` : '';
    return `<article class="card">
      <div class="wrap"><div class="photos">${photos}</div>${nav}</div>
      <div class="body">
        <div class="top"><h3>${esc(d.name)}</h3><span class="price">${esc(d.price)}</span></div>
        ${d.size ? `<p class="size">${esc(d.size)}</p>` : ''}
        ${d.items ? `<ul>${d.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
        ${d.text ? `<p style="margin:0;font-size:14.5px">${esc(d.text)}</p>` : ''}
        ${d.tags ? `<div class="tags">${d.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
        ${d.extra ? `<p class="extra">${esc(d.extra)}</p>` : ''}
      </div>
    </article>`;
  }

  async function load() {
    if (window.SUPABASE_URL && window.supabase) {
      try {
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await db.from('desserts').select('*').eq('hidden', false).order('sort');
        if (!error && data.length) return data;
      } catch (e) { console.warn(e); }
    }
    return window.SEED.filter(d => !d.hidden);
  }

  function render(list) {
    for (const cat of ['candy', 'cakes']) {
      document.getElementById(cat + '-grid').innerHTML = list
        .filter(d => d.category === cat)
        .map(d => card({ ...d, photos: d.photos || [] }))
        .join('');
    }
    initDots();
  }

  // гортання фото в картці: стрілки, крапки й лічильник
  function initDots() { document.querySelectorAll('.photos').forEach(el => {
    const wrap = el.parentElement;
    const dots = wrap.querySelectorAll('.dots span');
    if (!dots.length) return;
    const go = i => el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
    const cur = () => Math.round(el.scrollLeft / el.clientWidth);
    wrap.querySelector('.prev').addEventListener('click', () => go(cur() - 1));
    wrap.querySelector('.next').addEventListener('click', () => go(cur() + 1));
    dots.forEach(d => d.addEventListener('click', () => go(+d.dataset.i)));
    el.addEventListener('scroll', () => {
      const i = cur();
      dots.forEach((d, j) => d.classList.toggle('on', i === j));
      wrap.querySelector('.count').textContent = `${i + 1} / ${dots.length}`;
      wrap.querySelector('.prev').disabled = i === 0;
      wrap.querySelector('.next').disabled = i === dots.length - 1;
    }, { passive: true });
  }); }

  load().then(render);

  // вкладки
  const tabs = document.querySelectorAll('[role="tab"]');
  function show(id) {
    tabs.forEach(t => {
      const on = t.getAttribute('aria-controls') === id;
      t.setAttribute('aria-selected', on);
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    history.replaceState(null, '', '#' + id);
  }
  tabs.forEach(t => t.addEventListener('click', () => show(t.getAttribute('aria-controls'))));
  if (location.hash === '#cakes') show('cakes');

  // збільшення фото
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  let lbList = [], lbIdx = 0;
  function lbShow(i) {
    lbIdx = (i + lbList.length) % lbList.length;
    lbImg.src = lbList[lbIdx];
    lb.querySelectorAll('.nav-btn').forEach(b => b.hidden = lbList.length < 2);
  }
  lb.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); lbShow(lbIdx - 1); });
  lb.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); lbShow(lbIdx + 1); });
  document.addEventListener('click', e => {
    if (e.target.matches('.photos img')) {
      const imgs = [...e.target.parentElement.querySelectorAll('img')];
      lbList = imgs.map(i => i.src);
      lbShow(imgs.indexOf(e.target));
      lb.hidden = false;
    } else if (e.target.closest('#lightbox')) lb.hidden = true;
  });
  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') lb.hidden = true;
    if (e.key === 'ArrowLeft') lbShow(lbIdx - 1);
    if (e.key === 'ArrowRight') lbShow(lbIdx + 1);
  });
</script>
</body>
</html>
