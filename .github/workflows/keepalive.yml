# Безкоштовний Supabase засинає після 7 днів без запитів.
# Цей запуск раз на 3 дні робить один маленький запит до бази, щоб проєкт не ставав на паузу.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://swctmjluzxajhddbhjug.supabase.co/rest/v1/desserts?select=id&limit=1" \
            -H "apikey: sb_publishable_8V-sxx9gw-cYgZivLnVMOw_gxIarc0i"
